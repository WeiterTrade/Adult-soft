name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Тег v1.2.3 → версия 1.2.3, иначе 1.0.<номер сборки> (чтобы установщики обновлялись поверх)
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

jobs:
  android:
    name: Android + Android TV (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверка файлов проекта
        shell: bash
        run: |
          ls -la
          for f in gradlew settings.gradle.kts scripts/fetch-assets.sh composeApp/build.gradle.kts; do
            if [ ! -f "$f" ]; then
              echo "::error::Нет файла $f в корне репозитория. Загрузите СОДЕРЖИМОЕ архива (а не папку aa-cinema целиком)."
              exit 1
            fi
          done
          chmod +x gradlew
      - name: Шрифты
        run: bash scripts/fetch-assets.sh
      - name: Сборка APK
        run: bash ./gradlew :composeApp:assembleRelease --stacktrace
      - name: Переименование
        run: |
          mkdir -p out
          cp composeApp/build/outputs/apk/release/*.apk out/AdultAristocrat-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  windows:
    name: Windows 7/10/11
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверка файлов проекта
        shell: bash
        run: |
          ls -la
          for f in gradlew settings.gradle.kts scripts/fetch-assets.sh composeApp/build.gradle.kts; do
            if [ ! -f "$f" ]; then
              echo "::error::Нет файла $f в корне репозитория. Загрузите СОДЕРЖИМОЕ архива (а не папку aa-cinema целиком)."
              exit 1
            fi
          done
          chmod +x gradlew
      - name: Шрифты
        run: bash scripts/fetch-assets.sh
      - name: VLC (встраивается в программу)
        run: bash scripts/fetch-vlc-windows.sh
      - name: Сборка программы
        run: bash ./gradlew :composeApp:createDistributable --stacktrace
      - name: Inno Setup 6.2.2 (установщики работают и на Windows 7)
        shell: pwsh
        run: |
          # Качаем установщик напрямую с сайта автора (в Chocolatey версия 6.2.2 больше недоступна).
          # Если не вышло — используем Inno Setup, который уже есть на сборочной машине GitHub.
          $ErrorActionPreference = 'Continue'
          $dir = "C:\InnoSetup622"
          $urls = @(
            "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe",
            "https://github.com/jrsoftware/issrc/releases/download/is-6_2_2/innosetup-6.2.2.exe"
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile "$env:RUNNER_TEMP\is.exe" -UseBasicParsing
              Start-Process -FilePath "$env:RUNNER_TEMP\is.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER","/DIR=$dir" -Wait
              if (Test-Path "$dir\ISCC.exe") { break }
            } catch { Write-Host "Не скачалось: $u" }
          }
          $iscc = @("$dir\ISCC.exe", "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup не найден"; exit 1 }
          Write-Host "Inno Setup: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Упаковка
        run: |
          mkdir -p out
          V="${APP_VERSION#v}"
          ISCC="$(cygpath -u "$ISCC_PATH")"
          # Установщик Windows 10/11 и отдельный — Windows 7 (выбор языка: русский / English)
          (cd packaging/windows && "$ISCC" -Q "-DMyAppVersion=$V" AdultAristocrat.iss)
          (cd packaging/windows && "$ISCC" -Q "-DMyAppVersion=$V" -DWin7 AdultAristocrat.iss)
          APPDIR=composeApp/build/compose/binaries/main/app/AdultAristocrat
          cp packaging/win7/*.bat "$APPDIR/"
          cd composeApp/build/compose/binaries/main/app
          7z a -tzip "$GITHUB_WORKSPACE/out/AdultAristocrat-${APP_VERSION#v}-windows-portable-win7.zip" AdultAristocrat > /dev/null
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    name: Linux (deb + rpm + tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверка файлов проекта
        shell: bash
        run: |
          ls -la
          for f in gradlew settings.gradle.kts scripts/fetch-assets.sh composeApp/build.gradle.kts; do
            if [ ! -f "$f" ]; then
              echo "::error::Нет файла $f в корне репозитория. Загрузите СОДЕРЖИМОЕ архива (а не папку aa-cinema целиком)."
              exit 1
            fi
          done
          chmod +x gradlew
      - name: Шрифты
        run: bash scripts/fetch-assets.sh
      - name: Инструменты для RPM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Сборка
        run: bash ./gradlew :composeApp:packageDeb :composeApp:packageRpm :composeApp:createDistributable --stacktrace
      - name: Упаковка
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/deb/*.deb out/
          cp composeApp/build/compose/binaries/main/rpm/*.rpm out/
          tar -czf "out/AdultAristocrat-${APP_VERSION#v}-linux-x64.tar.gz" -C composeApp/build/compose/binaries/main/app "Adult Aristocrat"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  latest:
    name: Свежая сборка (прямые ссылки на файлы)
    # Публикуем даже если какая-то из платформ упала — то, что собралось
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [ android, windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Переносим метку latest на эту сборку
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Обновляем выпуск «latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/* > /dev/null 2>&1 || { echo "Нет собранных файлов"; exit 0; }
          ls -la dist
          gh release delete latest --yes || true
          gh release create latest dist/* \
            --title "Свежая сборка ${APP_VERSION}" \
            --notes "Автоматическая сборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}. APK: AdultAristocrat-android.apk" \
            --prerelease

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
